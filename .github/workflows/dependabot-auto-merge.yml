name: Dependabot approval and auto-merge

on:
  # Security review: .github/DEPENDABOT.md; pinned shared job, no checkout or PR execution.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@64d288620605a5474ae2b8e9682007d2926d7096 # v0.2.0
    with:
      repository: acgetchell/dotfiles
      policy: >-
        {"uv": {
          "files": ["pyproject.toml", "uv.lock"]
        }, "github_actions": {
          "files": [".github/workflows/ci.yml", ".github/workflows/dependabot-auto-merge.yml", ".github/workflows/zizmor.yml"]
        }}
