name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_CACHE_DIR: ".uv-cache"

jobs:
  verify:
    name: verify
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Resolve just version
        id: just_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash bin/resolve-just-version.sh justfile)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install just
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: just@${{ steps.just_version.outputs.version }}

      - name: Resolve repository tool versions
        id: tool_versions
        run: |
          set -euo pipefail

          resolve_version() {
            local name="$1"
            local value
            value="$(just --evaluate "$name")"
            if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid $name in justfile: ${value:-missing}"
              return 1
            fi
            printf '%s\n' "$value"
          }

          dprint_version="$(resolve_version dprint_version)"
          rumdl_version="$(resolve_version rumdl_version)"
          uv_version="$(resolve_version uv_version)"
          zizmor_version="$(resolve_version zizmor_version)"
          {
            printf 'dprint_version=%s\n' "$dprint_version"
            printf 'rumdl_version=%s\n' "$rumdl_version"
            printf 'uv_version=%s\n' "$uv_version"
            printf 'zizmor_version=%s\n' "$zizmor_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dprint
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: dprint@${{ steps.tool_versions.outputs.dprint_version }}

      - name: Install rumdl
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: rumdl@${{ steps.tool_versions.outputs.rumdl_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.tool_versions.outputs.uv_version }}
          enable-cache: true
          prune-cache: true

      - name: Sync Python tooling
        run: uv sync --locked --group dev

      - name: Install zizmor
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: zizmor@${{ steps.tool_versions.outputs.zizmor_version }}

      - name: Run CI checks
        run: just ci
