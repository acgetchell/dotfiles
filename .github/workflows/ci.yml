name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_CACHE_DIR: ".uv-cache"

jobs:
  verify:
    name: verify
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Resolve just version
        id: just_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash bin/resolve-just-version.sh justfile)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install just
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: just@${{ steps.just_version.outputs.version }}

      - name: Resolve repository tool versions
        id: tool_versions
        run: |
          set -euo pipefail

          resolve_version() {
            local name="$1"
            local value
            local version_pattern
            value="$(just --evaluate "$name")"
            version_pattern="$(just --evaluate cargo_version_pattern)"
            if [[ "$name" == uv_version ]]; then
              version_pattern='[0-9]+\.[0-9]+\.[0-9]+'
            fi
            if [[ ! "$value" =~ ^${version_pattern}$ ]]; then
              echo "::error::Invalid $name in justfile: ${value:-missing}" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }

          dprint_version="$(resolve_version dprint_version)"
          rumdl_version="$(resolve_version rumdl_version)"
          uv_version="$(resolve_version uv_version)"
          {
            printf 'dprint_version=%s\n' "$dprint_version"
            printf 'rumdl_version=%s\n' "$rumdl_version"
            printf 'uv_version=%s\n' "$uv_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dprint
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: dprint@${{ steps.tool_versions.outputs.dprint_version }}

      - name: Install rumdl
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: rumdl@${{ steps.tool_versions.outputs.rumdl_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.tool_versions.outputs.uv_version }}
          enable-cache: true
          prune-cache: true

      - name: Sync Python tooling
        run: just python-sync

      - name: Install Stow for integration tests
        run: brew install stow

      - name: Install managed security scanners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just tools-sync

      - name: Audit dependencies and secrets
        run: just security

      - name: Run CI checks
        run: just ci

  linux-review:
    name: Linux portable review
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure user-owned review directories
        run: |
          {
            printf 'DOTFILES_REVIEW_PREFIX=%s/dotfiles-review/install\n' "$RUNNER_TEMP"
            printf 'DOTFILES_REVIEW_CACHE=%s/dotfiles-review/cache\n' "$RUNNER_TEMP"
            printf 'DOTFILES_REVIEW_TMP=%s/dotfiles-review/tmp\n' "$RUNNER_TEMP"
            printf 'DOTFILES_REVIEW_SKILLS_DIR=%s/dotfiles-review/skills\n' "$RUNNER_TEMP"
            printf 'DOTFILES_REVIEW_ARTIFACTS=%s/target/linux-review\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      # Only base host prerequisites use the runner image's package manager.
      # The installer itself has no privilege or package-manager requirement.
      - name: Provide base Linux executor tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bash curl git tar unzip zsh stow

      - name: Provision unprivileged pinned tools and locked Python
        run: bash bin/linux-review.sh setup

      - name: Rerun setup to verify idempotence
        run: bash bin/linux-review.sh setup

      - name: Report Linux executor resource limits
        run: |
          bash bin/linux-review.sh exec cat /proc/self/limits
          for name in pids.max pids.current memory.max memory.current cpu.max; do
            path="/sys/fs/cgroup/$name"
            if [[ -r "$path" ]]; then
              printf '%s: ' "$name"
              cat "$path"
            fi
          done

      - name: Run offline portable suite including native timing tests
        run: bash bin/linux-review.sh check

      - name: Run timed graph publication and final proof smoke
        run: bash bin/linux-review.sh smoke

      - name: Publish platform, timing, and graph evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-review-${{ github.sha }}
          path: target/linux-review/
          retention-days: 14
          if-no-files-found: warn

  validation-timing:
    name: Validation timing (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux executor shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bash zsh
          command -v bash
          command -v zsh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Resolve just version
        id: just_version
        run: |
          version="$(bash bin/resolve-just-version.sh justfile)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install just
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: just@${{ steps.just_version.outputs.version }}

      - name: Resolve uv version
        id: uv_version
        run: |
          version="$(just --evaluate uv_version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv_version.outputs.version }}
          enable-cache: false

      - name: Exercise native executor timing
        run: just test-validation-timing

      - name: Exercise native Windows Semgrep entry point
        if: runner.os == 'Windows'
        env:
          SEMGREP_SEND_METRICS: "off"
          OTEL_SDK_DISABLED: "true"
        run: uv run --locked --project tooling/semgrep semgrep --disable-version-check --metrics off --version
