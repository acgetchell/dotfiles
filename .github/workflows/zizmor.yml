name: zizmor

permissions: {}

concurrency:
  group: zizmor-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "42 18 * * 5"
  workflow_dispatch:

jobs:
  analyze:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml

      - name: Fail on workflow findings
        id: audit
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --group dev just zizmor-check --require-online

      - name: Produce SARIF even when the finding gate fails
        id: sarif
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --group dev just zizmor-check --require-online --format sarif > "$RUNNER_TEMP/zizmor.sarif"

      - name: Upload security findings
        if: >-
          ${{ !cancelled() && steps.sarif.outcome == 'success'
              && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
